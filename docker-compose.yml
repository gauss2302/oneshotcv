services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-constructor-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      FRONTEND_ORIGIN: ${PUBLIC_APP_URL:-http://localhost}
      AUTH_PUBLIC_URL: ${PUBLIC_APP_URL:-http://localhost}
      INDEPENDENT_BACKEND_URL: http://backend:4000
      NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
    expose:
      - "4000"
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4000/api/health', (r) => { process.exit(r.statusCode && r.statusCode < 500 ? 0 : 1); }).on('error', () => process.exit(1));",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  frontend:
    build:
      context: ./
      dockerfile: ./frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_APP_URL:-http://localhost}
        NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
        NEXT_PUBLIC_MINIO_PUBLIC_URL: ${NEXT_PUBLIC_MINIO_PUBLIC_URL:-http://localhost:9000}
    container_name: resume-constructor-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
      NEXT_PUBLIC_BACKEND_URL: ${PUBLIC_APP_URL:-http://localhost}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/', (r) => { process.exit(r.statusCode && r.statusCode < 500 ? 0 : 1); }).on('error', () => process.exit(1));",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: resume-constructor-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./frontend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge
