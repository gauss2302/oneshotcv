# Local-dev convenience: provides Postgres and MinIO so `docker compose up`
# works out of the box. Compose auto-loads this file alongside docker-compose.yml.
# For prod runs that use externally-provisioned infra, opt out with:
#   docker compose -f docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: resume-constructor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resume_constructor
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_constructor"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: resume-constructor-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/resume_constructor
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: resume-photos
      NEXT_PUBLIC_MINIO_PUBLIC_URL: http://localhost:9000

  frontend:
    environment:
      NEXT_PUBLIC_MINIO_PUBLIC_URL: http://localhost:9000

volumes:
  postgres-data:
  minio-data:
